[package]
name = "maestro"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.12", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.151"
slint = "1.17.1"
tokio = { version = "1", features = ["full"] }
